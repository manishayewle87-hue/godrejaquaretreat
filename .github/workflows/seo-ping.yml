name: SEO Indexing Ping & Automation

on:
  push:
    branches:
      - main
  schedule:
    # Run automatically every day at midnight UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  seo-ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install googleapis xml2js

      - name: Wait for Vercel Deployment (3 minutes)
        # Give Vercel time to deploy the new build and generate the sitemap
        run: sleep 180

      - name: Ping Google & Bing Global Sitemap Endpoints
        run: |
          echo "Pinging Google..."
          curl -s "https://www.google.com/ping?sitemap=https://godrejaquaretreat.godrejparkworld.com/sitemap.xml" > /dev/null
          echo "Google Pinged successfully."
          
          echo "Pinging Bing..."
          curl -s "https://www.bing.com/ping?sitemap=https://godrejaquaretreat.godrejparkworld.com/sitemap.xml" > /dev/null
          echo "Bing Pinged successfully."

      - name: Execute Google Indexing API Push
        # This step will gracefully skip if the secret is not provided
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: node scripts/google-index.js
